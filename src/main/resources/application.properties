# ===================================================================
# Smart To-Do List Application - Spring Boot Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=Smart-ToDo-App

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# Note: Ensure MySQL service is running and 'todo_db' database is created:
# CREATE DATABASE IF NOT EXISTS todo_db;

spring.datasource.url=jdbc:mysql://localhost:3306/todo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Hibernate JPA Configuration
# ===================================================================
# Automatically validate or update tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Open-EntityManager-in-View configuration
spring.jpa.open-in-view=false

# JSON Date and Time formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

